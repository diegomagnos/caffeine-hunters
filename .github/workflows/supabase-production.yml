name: Supabase production migrations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operação em produção
        type: choice
        default: deploy
        options:
          - deploy
          - reconcile

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.54.11
      - name: Build baseline reference in disposable PostgreSQL
        if: inputs.operation == 'reconcile'
        run: node scripts/test-rls.mjs --baseline-reference > "$RUNNER_TEMP/caffeine-baseline.json"
      - name: Verify and run selected operation
        env:
          OPERATION: ${{ inputs.operation }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_SSL_ROOT_CERT: ${{ secrets.SUPABASE_DB_SSL_ROOT_CERT }}
          PGSSLMODE: verify-full
          PGGSSENCMODE: disable
          PGCONNECT_TIMEOUT: "10"
        run: |
          if [[ -z "$SUPABASE_DB_SSL_ROOT_CERT" ]]; then
            echo "::error::Configure SUPABASE_DB_SSL_ROOT_CERT no environment production com a CA do Supabase em PEM."
            exit 1
          fi
          PGSSLROOTCERT="$(mktemp "$RUNNER_TEMP/supabase-ca.XXXXXX")"
          trap 'rm -f -- "$PGSSLROOTCERT"' EXIT
          printf '%s\n' "$SUPABASE_DB_SSL_ROOT_CERT" > "$PGSSLROOTCERT"
          unset SUPABASE_DB_SSL_ROOT_CERT
          if ! openssl x509 -in "$PGSSLROOTCERT" -noout -checkend 0 > /dev/null 2>&1; then
            echo "::error::A CA do Supabase deve ser um certificado PEM válido e não vencido."
            exit 1
          fi
          export PGSSLROOTCERT
          case "$OPERATION" in
            deploy) python3 -u scripts/deploy-supabase-migrations.py ;;
            reconcile) python3 -u scripts/deploy-supabase-migrations.py --reconcile "$RUNNER_TEMP/caffeine-baseline.json" ;;
            *) exit 1 ;;
          esac
