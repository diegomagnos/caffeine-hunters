name: Supabase Edge Functions Deployment

on:
  workflow_dispatch:
    inputs:
      function:
        description: Edge Function a publicar em produção
        type: choice
        required: true
        default: send-group-invitation
        options:
          - send-group-invitation

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      no_verify_jwt: ${{ steps.function.outputs.no_verify_jwt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.5.6
      - name: Validate selected function
        id: function
        env:
          FUNCTION_NAME: ${{ inputs.function }}
        run: |
          case "$FUNCTION_NAME" in
            send-group-invitation)
              deno check supabase/functions/send-group-invitation/index.ts
              npm run test:invitations
              # O handler valida o JWT via Supabase Auth antes de chamar RPCs privilegiadas.
              echo 'no_verify_jwt=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo '::error::Edge Function não autorizada para publicação.'
              exit 1
              ;;
          esac

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      # Mesmo grupo do workflow de migrações de produção.
      group: supabase-production-migrations
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.54.11
      - name: Publish selected function
        env:
          FUNCTION_NAME: ${{ inputs.function }}
          NO_VERIFY_JWT: ${{ needs.validate.outputs.no_verify_jwt }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo '::error::Configure o secret SUPABASE_ACCESS_TOKEN no environment production.'
            exit 1
          fi
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z]{20}$ ]]; then
            echo '::error::Confira a variable SUPABASE_PROJECT_REF no environment production.'
            exit 1
          fi
          if [[ "$NO_VERIFY_JWT" != true && "$NO_VERIFY_JWT" != false ]]; then
            echo '::error::A validação deve definir a política de JWT da função.'
            exit 1
          fi
          if ! supabase functions deploy "$FUNCTION_NAME" \
            --project-ref "$SUPABASE_PROJECT_REF" --use-api \
            --no-verify-jwt="$NO_VERIFY_JWT" > /dev/null 2>&1; then
            echo '::error::A publicação falhou. Confira o estado da função no Supabase e siga docs/SUPABASE_EDGE_FUNCTIONS.md.'
            exit 1
          fi
          printf 'Edge Function %s publicada a partir de %s.\n' "$FUNCTION_NAME" "$GITHUB_SHA"
